<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pesanan Pelayan - Bakso Sulawesi</title>
    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#fff1f2', 100: '#ffe4e6', 500: '#f43f5e',
                            600: '#e11d48', 700: '#be123c', 800: '#9f1239', 900: '#881337',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gradient-to-r from-brand-900 via-brand-800 to-rose-900 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2.5 rounded-xl backdrop-blur-md border border-white/20 shadow-inner">
                    <i class="fa-solid fa-bowl-food text-2xl text-rose-300"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                        Bakso Sulawesi <span class="text-xs px-2 py-0.5 rounded-full bg-rose-500/30 border border-rose-400/30 text-rose-200">Pelayan POS</span>
                    </h1>
                    <p class="text-xs text-rose-200 font-medium">Input Pesanan & Kirim Otomatis via WhatsApp</p>
                </div>
            </div>
            <div class="flex items-center gap-2 bg-emerald-600/20 px-3 py-1.5 rounded-xl border border-emerald-400/30 text-emerald-200 text-xs font-semibold">
                <i class="fa-brands fa-whatsapp text-sm text-emerald-400"></i> Target: Admin / Dapur
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left: Menu Catalog -->
            <div class="lg:col-span-7 xl:col-span-8 space-y-6">
                <!-- Search & Category Filter -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row gap-3 justify-between items-center">
                    <div class="relative w-full sm:w-72">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-magnifying-glass text-sm"></i>
                        </span>
                        <input type="text" id="searchMenu" oninput="filterMenus()" placeholder="Cari menu..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div class="flex items-center gap-1.5 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0">
                        <button onclick="filterCategory('all')" id="catBtn-all" class="category-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-brand-900 text-white transition-all shrink-0">Semua</button>
                        <button onclick="filterCategory('Bakso')" id="catBtn-Bakso" class="category-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all shrink-0">Bakso</button>
                        <button onclick="filterCategory('Mie Ayam')" id="catBtn-Mie Ayam" class="category-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all shrink-0">Mie Ayam</button>
                        <button onclick="filterCategory('Tambahan')" id="catBtn-Tambahan" class="category-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all shrink-0">Tambahan</button>
                    </div>
                </div>

                <!-- Menu Cards Grid -->
                <div id="menuGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
                    <!-- Rendered by JS -->
                </div>
            </div>

            <!-- Right: Order Form / Cart -->
            <div class="lg:col-span-5 xl:col-span-4">
                <div class="bg-white rounded-2xl shadow-md border border-slate-200 sticky top-20 overflow-hidden flex flex-col max-h-[calc(100vh-100px)]">
                    <div class="p-4 bg-gradient-to-r from-slate-900 to-slate-800 text-white flex justify-between items-center">
                        <h2 class="font-bold text-base flex items-center gap-2">
                            <i class="fa-solid fa-receipt text-rose-400"></i> Detail Pesanan Meja
                        </h2>
                        <span id="cartCountBadge" class="bg-rose-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">0 item</span>
                    </div>

                    <!-- Customer Info Input -->
                    <div class="p-4 border-b border-slate-100 bg-slate-50/50 space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Nomor Meja / Nama Pelanggan *</label>
                            <input type="text" id="inputNoMeja" placeholder="Contoh: Meja 04 / Bpk. Rahmat" class="w-full px-3.5 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 font-medium">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Catatan Tambahan (Opsional)</label>
                            <input type="text" id="inputCatatanGlobal" placeholder="Contoh: Kuah pisah, jangan pakai daun bawang..." class="w-full px-3.5 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-brand-500">
                        </div>
                    </div>

                    <!-- Cart Item List -->
                    <div id="cartList" class="p-4 overflow-y-auto flex-1 space-y-3 divide-y divide-slate-100">
                        <div class="text-center py-12 text-slate-400">
                            <i class="fa-solid fa-basket-shopping text-4xl mb-2 text-slate-300"></i>
                            <p class="text-sm font-medium">Belum ada menu dipilih</p>
                        </div>
                    </div>

                    <!-- Cart Footer & Send WhatsApp Button -->
                    <div class="p-4 border-t border-slate-100 bg-white space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-xs text-slate-500 font-medium">Total Estimasi Harga:</span>
                            <span id="cartTotalPrice" class="text-sm font-extrabold text-brand-600">Rp 0</span>
                        </div>
                        <button onclick="sendToWhatsApp()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/25 transition-all flex items-center justify-center gap-2 text-sm">
                            <i class="fa-brands fa-whatsapp text-lg"></i> Kirim Pesanan ke WhatsApp Dapur
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-24 opacity-0 transition-all duration-300 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 border border-slate-700 text-sm">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toastMessage">Berhasil</span>
    </div>

    <!-- JavaScript Link -->
    <script src="script.js"></script>
</body>
</html>
